name: roadwatch
description: RoadWatch — AI-Powered Pothole Reporting (SIH 2026, MB-04)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  http: ^1.2.1

  # Camera + gallery
  image_picker: ^1.1.2

  # GPS
  geolocator: ^12.0.0

  # Map (OpenStreetMap — no API key needed)
  flutter_map: ^6.2.1
  latlong2: ^0.9.1

  # Firebase (push notifications)
  firebase_core: ^2.31.0
  firebase_messaging: ^14.9.4

  # Date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
