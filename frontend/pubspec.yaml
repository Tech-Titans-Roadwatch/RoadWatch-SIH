name: roadwatch
description: RoadWatch — AI-Powered Pothole Reporting (SIH 2026, MB-04)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  http: ^1.2.1
  shared_preferences: ^2.2.2

  # Camera + gallery
  image_picker: ^1.1.2
  camera: ^0.11.0+2

  # GPS
  geolocator: ^13.0.1

  # Map (OpenStreetMap — no API key needed)
  flutter_map: ^6.2.1
  latlong2: ^0.9.1

  # Firebase (push notifications)
  firebase_core: ^3.15.0
  firebase_messaging: ^15.2.0

  # Date formatting
  intl: ^0.19.0

  # Local Notifications for status updates (Submitted, Verified, Assigned, Resolved)
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# This forces the camera plugin to use the patched version that fixes the CallbackToFutureAdapter error
dependency_overrides:
  camera_android_camerax: ^0.7.4+8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/